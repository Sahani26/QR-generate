<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL to QR Code Generator</title>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .logo-selector {
            margin: 20px 0;
        }

        .logo-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo-option {
            cursor: pointer;
        }

        .logo-option input {
            display: none;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            border: 2px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .logo-option input:checked + .logo-box {
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.15);
        }

        .logo-box i {
            font-size: 28px;
        }

        .google-logo {
            font-family: Arial, sans-serif;
            font-size: 30px;
            font-weight: bold;
            color: #4285F4;
        }

        .fa-whatsapp {
            color: #25D366;
        }

        .fa-facebook {
            color: #1877F2;
        }

        .fa-x-twitter {
            color: #000;
        }

        #url-input {
            width: 80%;
            padding: 10px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #generate-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }

        #download-btn {
            background-color: #2196F3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            display: none;
        }

        #generate-btn:hover {
            background-color: #45a049;
        }

        #download-btn:hover {
            background-color: #0b7dda;
        }

        .instructions {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
            text-align: left;
        }

        .qr-wrapper {
            display: none;
            border: 1px solid #eee;
            border-radius: 8px;
            background: white;
            margin: 30px auto;
        }

        .qr-container {
            position: relative;
            display: inline-block;
        }

        #qrcode {
            padding: 5px;
        }

        .qr-center-icons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 50%;
        }

        .qr-center-icons i {
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>URL to QR Code Generator</h1>

    <div class="instructions">
        <p>
            Enter a URL below, select a logo and click
            "Generate QR Code".
        </p>
    </div>


    <!-- Logo Selector -->

    <div class="logo-selector">

        <div class="logo-options">

            <label class="logo-option">
                <input type="radio"
                       name="qr-logo"
                       value="google"
                       checked>

                <div class="logo-box">
                    <span class="google-logo">G</span>
                </div>
            </label>


            <label class="logo-option">
                <input type="radio"
                       name="qr-logo"
                       value="whatsapp">

                <div class="logo-box">
                    <i class="fab fa-whatsapp"></i>
                </div>
            </label>


            <label class="logo-option">
                <input type="radio"
                       name="qr-logo"
                       value="facebook">

                <div class="logo-box">
                    <i class="fab fa-facebook"></i>
                </div>
            </label>


            <label class="logo-option">
                <input type="radio"
                       name="qr-logo"
                       value="twitter">

                <div class="logo-box">
                    <i class="fab fa-x-twitter"></i>
                </div>
            </label>

        </div>

    </div>


    <input type="url"
           id="url-input"
           placeholder="Enter URL (e.g., https://example.com)"
           required>

    <br>

    <button id="generate-btn">
        Generate QR Code
    </button>


    <div class="qr-wrapper" id="qr-wrapper">

        <div class="qr-container">

            <div id="qrcode"></div>

            <div class="qr-center-icons"
                 id="qr-center-logo">
            </div>

        </div>

    </div>

    <br>


    <button id="download-btn">
        <i class="fas fa-download"></i>
        Download PNG
    </button>


    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>


    <script>

        function updateLogo() {

            const selected =
                document.querySelector(
                    'input[name="qr-logo"]:checked'
                ).value;

            const logo =
                document.getElementById('qr-center-logo');


            if (selected === 'google') {

                logo.innerHTML =
                    '<span class="google-logo">G</span>';

            }
            else if (selected === 'whatsapp') {

                logo.innerHTML =
                    '<i class="fab fa-whatsapp"></i>';

            }
            else if (selected === 'facebook') {

                logo.innerHTML =
                    '<i class="fab fa-facebook"></i>';

            }
            else if (selected === 'twitter') {

                logo.innerHTML =
                    '<i class="fab fa-x-twitter"></i>';

            }

        }


        document.querySelectorAll(
            'input[name="qr-logo"]'
        ).forEach(function (radio) {

            radio.addEventListener(
                'change',
                updateLogo
            );

        });


        document.getElementById(
            'generate-btn'
        ).addEventListener(
            'click',
            function () {

                const url =
                    document.getElementById(
                        'url-input'
                    ).value.trim();


                if (!url) {

                    alert(
                        'Please enter a valid URL'
                    );

                    return;

                }


                document.getElementById(
                    'qrcode'
                ).innerHTML = '';


                new QRCode(
                    document.getElementById(
                        'qrcode'
                    ),
                    {
                        text: url,
                        width: 200,
                        height: 200,

                        colorDark: "#000000",
                        colorLight: "#ffffff",

                        correctLevel:
                            QRCode.CorrectLevel.H
                    }
                );


                updateLogo();


                document.getElementById(
                    'qr-wrapper'
                ).style.display =
                    'inline-block';


                document.getElementById(
                    'download-btn'
                ).style.display =
                    'inline-block';

            }
        );


        document.getElementById(
            'download-btn'
        ).addEventListener(
            'click',
            async function () {

                const button = this;

                button.disabled = true;

                button.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i> Downloading...';


                const wrapper =
                    document.getElementById(
                        'qr-wrapper'
                    );


                try {

                    const canvas =
                        await html2canvas(
                            wrapper,
                            {
                                backgroundColor:
                                    "#ffffff",

                                scale: 4,

                                useCORS: true
                            }
                        );


                    const link =
                        document.createElement(
                            'a'
                        );


                    link.download =
                        'qr-code-with-icon.png';


                    link.href =
                        canvas.toDataURL(
                            'image/png'
                        );


                    link.click();

                }
                catch (error) {

                    console.error(error);

                    alert(
                        'Download failed'
                    );

                }


                button.disabled = false;

                button.innerHTML =
                    '<i class="fas fa-download"></i> Download PNG';

            }
        );


        updateLogo();

    </script>

</body>
</html>
